<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0dc">
  <title>Track your order | QamotyChips</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .track-wrap{width:min(560px,calc(100% - 32px));margin:64px auto 90px}.track-card{background:var(--paper);border:1px solid #e8e3d1;border-radius:20px;padding:28px;box-shadow:0 14px 35px #342d1610}.track-card h1{font-size:clamp(36px,8vw,54px);margin:12px 0}.track-card>p{color:var(--muted);line-height:1.6}.track-form{display:grid;gap:12px;margin-top:22px}.track-form label{font-size:13px;font-weight:800}.track-form input{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#fffefa;padding:13px;font:inherit}.track-result{display:none;margin-top:20px;padding:18px;border-radius:14px;background:#e9efce}.track-result.show{display:block}.track-result h2{font-size:22px;margin:0 0 8px}.track-result p{font-size:13px;line-height:1.6;margin:0;color:#495340}.track-meta{font-size:12px;color:var(--muted);margin-top:10px}.track-error{min-height:18px;color:#9b3b25;font-size:13px;margin-top:12px}.track-back{display:inline-block;margin-top:20px;color:var(--green);font-weight:800;text-decoration:underline}
  </style>
</head>
<body>
  <header class="wrap"><a class="brand" href="index.html" aria-label="QamotyChips home"><span class="brand-mark" aria-hidden="true"><img src="kamote-logo.svg" alt=""></span><span class="brand-name">QamotyChips</span></a><a class="button button-secondary" href="index.html">Shop chips</a></header>
  <main class="track-wrap">
    <section class="track-card">
      <div class="eyebrow">Order updates</div><h1>Track your preorder.</h1><p>Enter the tracking code shown after you submitted your order. It’s also in the order confirmation screen.</p>
      <form class="track-form" id="trackForm"><label for="trackingInput">Your tracking code<input id="trackingInput" type="text" inputmode="text" autocomplete="off" placeholder="Paste your order code" required></label><button class="button button-primary" type="submit" id="trackButton">Check status</button></form>
      <p class="track-error" id="trackError" role="status" aria-live="polite"></p>
      <div class="track-result" id="trackResult" aria-live="polite"><h2 id="statusTitle"></h2><p id="statusDescription"></p><div class="track-meta" id="orderMeta"></div></div>
      <a class="track-back" href="index.html">← Back to Kamote Chips</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="track.js"></script>
</body>
</html>
